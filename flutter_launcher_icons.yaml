# App icons for every platform, generated from assets/icon/ with
# `dart run flutter_launcher_icons`. The PNGs there are rendered from the
# SVGs next to them.
flutter_launcher_icons:
  # Android: adaptive icon (API 26+), themed icon (Android 13+), and the
  # rounded tile for older versions.
  android: "ic_launcher"
  min_sdk_android: 24
  image_path_android: "assets/icon/app_icon.png"
  adaptive_icon_background: "assets/icon/adaptive_background.png"
  adaptive_icon_foreground: "assets/icon/adaptive_foreground.png"
  adaptive_icon_monochrome: "assets/icon/adaptive_monochrome.png"
  # The foreground PNG is already framed for the 108dp adaptive canvas.
  adaptive_icon_foreground_inset: 0

  # iOS rounds the corners itself and rejects transparency.
  ios: true
  image_path_ios: "assets/icon/app_icon_square.png"
  remove_alpha_ios: true

  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#141417"
    theme_color: "#141417"

  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256

  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"
