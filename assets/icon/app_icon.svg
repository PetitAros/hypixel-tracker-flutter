<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26262C"/>
      <stop offset="1" stop-color="#141417"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD24A"/>
      <stop offset="1" stop-color="#FFAA00"/>
    </linearGradient>
    <linearGradient id="earth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F28C0F"/>
      <stop offset="1" stop-color="#C85A08"/>
    </linearGradient>
  </defs>

  <!-- App tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#FFAA00" stroke-opacity="0.18" stroke-width="4"/>

  <!-- Tree -->
  <rect x="242" y="196" width="28" height="76" fill="#B04E08"/>
  <rect x="190" y="116" width="132" height="96" rx="10" fill="url(#gold)"/>
  <rect x="190" y="116" width="132" height="20" rx="10" fill="#FFE27A" opacity="0.6"/>

  <!-- Island top -->
  <rect x="128" y="270" width="256" height="34" rx="6" fill="url(#gold)"/>

  <!-- Island underside (stepped, blocky) -->
  <path d="M128 304 H384 V338 H348 V372 H308 V404 H274 V428 H238 V404 H204 V372 H164 V338 H128 Z" fill="url(#earth)"/>

  <!-- Floating blocks -->
  <rect x="364" y="150" width="30" height="30" rx="4" fill="#FFAA00" opacity="0.9" transform="rotate(15 379 165)"/>
  <rect x="112" y="196" width="20" height="20" rx="3" fill="#FFAA00" opacity="0.55" transform="rotate(-12 122 206)"/>

  <!-- Sparkle -->
  <path d="M392 330 l7 17 17 7 -17 7 -7 17 -7 -17 -17 -7 17 -7 Z" fill="#FFE27A"/>
</svg>
